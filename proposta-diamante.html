<style>
/* ===== CONFIGURAÇÃO PARA O DESENVOLVEDOR (ver README no topo do script) ===== */
:root{--dark:#00083b;--blue:#1d327b;--vivid:#0005e1;--cy:#25bbee;--red:#e30613;--gray:#f5f5f5;--txt:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Montserrat',Arial,sans-serif;color:var(--txt);background:#fff;-webkit-text-size-adjust:100%}
h1,h2,h3,.m{font-family:'Montserrat','Inter',sans-serif}
.hd{background:var(--dark);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px;position:relative;border-bottom:4px solid var(--blue)}
.hd img{height:34px;display:block;margin-bottom:14px}
.hd .k{font:600 11px 'Montserrat',Arial,sans-serif;letter-spacing:.14em;color:var(--cy);text-transform:uppercase}
.hd h1{font:800 26px/1.15 'Montserrat',Arial,sans-serif;margin-top:6px;max-width:640px}.hd h1 span{color:var(--cy)}
.who{font:400 12px/1.4 'Inter',Arial,sans-serif;color:#b9c6ee;margin-top:10px}
.alert{background:var(--red);color:#fff;text-align:center;padding:11px 16px;font:800 12px/1.3 'Montserrat',Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase}
.alert span{font-weight:600}
main{max-width:980px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.lead{font:400 15px/1.5 'Inter',Arial,sans-serif;margin-bottom:18px}.lead b{color:var(--blue)}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.hd h1{font-size:34px}}
.card{border:1px solid #dde1eb;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,8,59,.10);background:#fff}
.top{background:var(--blue);color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center}
.top b{font:800 19px 'Montserrat',Arial,sans-serif}.top span{font:600 12px 'Montserrat',Arial,sans-serif;color:var(--cy)}
.in{padding:16px}
.lab{font:600 10px 'Montserrat',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#5c6478}
.price{font:800 30px/1.1 'Montserrat',Arial,sans-serif;color:var(--vivid);margin:4px 0 6px}
.old{font:400 13px 'Inter',Arial,sans-serif;color:#5c6478}.old s{color:#8a93a8}
.save{display:inline-block;margin-top:8px;background:#e8ecf8;color:var(--blue);border-radius:20px;padding:3px 11px;font:700 12px 'Montserrat',Arial,sans-serif}
.demo{margin-top:14px;background:var(--gray);border-left:4px solid var(--cy);border-radius:6px;padding:11px 13px}
.demo .dl{font:600 10px 'Montserrat',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#5c6478}
.opt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.opt b{font:800 17px 'Montserrat',Arial,sans-serif;color:var(--blue)}.opt span{font:400 12px 'Inter',Arial,sans-serif}
.prem{margin-top:18px;background:var(--vivid);color:#fff;border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prem .v{font:800 34px/1 'Montserrat',Arial,sans-serif}.prem .k{font:700 10px 'Montserrat',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--cy);margin-bottom:4px}
.prem .t{font:400 14px/1.45 'Inter',Arial,sans-serif;flex:1;min-width:220px}
h2{font:800 20px 'Montserrat',Arial,sans-serif;color:var(--blue);margin:28px 0 12px}h2 span{color:var(--cy)}
.steps{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--gray);border-radius:12px;padding:16px}
.n{width:34px;height:34px;border-radius:50%;background:var(--vivid);color:#fff;font:800 16px/34px 'Montserrat',Arial,sans-serif;text-align:center;margin-bottom:10px}
.step h3{font:700 15px/1.25 'Montserrat',Arial,sans-serif;color:var(--blue);margin-bottom:6px}.step p{font:400 13px/1.5 'Inter',Arial,sans-serif}
.fn{margin-top:26px;font:400 12px/1.5 'Inter',Arial,sans-serif;color:#5c6478;border-top:1px solid #e6e9f2;padding-top:12px}
.err{max-width:560px;margin:60px auto;padding:0 20px;text-align:center}.err h2{margin-top:0}
.btn{display:inline-block;margin-top:14px;background:var(--vivid);color:#fff;border-radius:7px;padding:12px 22px;font:700 13px 'Montserrat',Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase;text-decoration:none}
.ft{background:var(--dark);color:#cdd7f7;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));font:400 11px/1.6 'Inter',Arial,sans-serif}.ft img{height:22px;display:block;margin-bottom:8px}
@media print{.ft{display:none}}

.lg{max-width:420px;margin:28px auto;padding:0 16px}
.lgc{border:1px solid #dde1eb;border-radius:12px;box-shadow:0 2px 12px rgba(0,8,59,.10);padding:22px}
.lgc h2{margin:0 0 6px;font:800 18px 'Montserrat',Arial,sans-serif}
.lgc p{font:400 13px/1.5 'Inter',Arial,sans-serif;color:#5c6478;margin-bottom:14px}
.lgc label{display:block;font:600 10px 'Montserrat',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#5c6478;margin-bottom:5px}
.lgc input{width:100%;padding:12px;border:1px solid #c3cfe2;border-radius:8px;font:400 16px 'Inter',Arial,sans-serif;margin-bottom:12px}
.lgc button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--vivid);color:#fff;font:700 13px 'Montserrat',Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.lgc button[disabled]{opacity:.6;cursor:default}
.lgc .lk{background:none;color:var(--blue);margin-top:8px;text-transform:none;font:600 12px 'Inter',Arial,sans-serif;text-decoration:underline}
.msg{border-radius:8px;padding:10px 12px;font:400 13px/1.4 'Inter',Arial,sans-serif;margin-bottom:12px;background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}
.sel{margin:0 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sel label{font:600 11px 'Montserrat',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5c6478}
.sel select{padding:8px 10px;border:1px solid #c3cfe2;border-radius:8px;font:600 14px 'Inter',Arial,sans-serif}
.out{margin-top:14px;text-align:center}.out button{background:none;border:0;color:#5c6478;font:400 12px 'Inter',Arial,sans-serif;text-decoration:underline;cursor:pointer}
@media print{.sel,.out{display:none}}

.wm{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:50;background-repeat:repeat;background-size:760px 380px}
.sum{margin:0 0 18px}.sum h2{margin-top:6px}
.tb{width:100%;border-collapse:collapse;font:400 13px 'Inter',Arial,sans-serif;margin-top:6px}
.tb th{background:var(--blue);color:#fff;text-align:left;padding:8px 10px;font:700 11px 'Montserrat',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.tb th.r,.tb td.r{text-align:right}.tb td{padding:8px 10px;border-bottom:1px solid #e6e9f2;vertical-align:top}
.tb tr.tot td{font:800 15px 'Montserrat',Arial,sans-serif;color:var(--blue);border-top:2px solid var(--blue)}
.inf{margin-top:10px;font:400 12px/1.6 'Inter',Arial,sans-serif;color:#5c6478}
.emi{margin-top:30px;border-top:3px solid var(--blue);padding-top:6px}.emi h3{font:800 15px 'Montserrat',Arial,sans-serif;color:var(--blue);margin:22px 0 8px}
.emt{font:400 13px/1.5 'Inter',Arial,sans-serif;color:#5c6478;margin-bottom:12px}
.fm{display:grid;gap:10px;grid-template-columns:1fr}@media(min-width:700px){.fm{grid-template-columns:repeat(3,1fr)}.fc.w2{grid-column:span 2}.fc.w3{grid-column:span 3}}
.fc label{display:block;font:600 10px 'Montserrat',Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#5c6478;margin-bottom:4px}
.fc input,.fc select,.fc textarea{width:100%;padding:10px;border:1px solid #c3cfe2;border-radius:8px;font:400 14px 'Inter',Arial,sans-serif;background:#fff}
.emi>button{margin-top:12px;padding:12px 22px;border:0;border-radius:8px;background:var(--vivid);color:#fff;font:700 13px 'Montserrat',Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.emi>button[disabled]{opacity:.6}
.res .ok2{margin-top:14px;background:#e8f5e9;border:1px solid #b7dfb9;border-radius:10px;padding:12px 14px;font:400 13px/1.5 'Inter',Arial,sans-serif}.res .lnk{word-break:break-all;margin:6px 0;color:#1d327b}
button.sm,a.sm{display:inline-block;margin:4px 6px 0 0;padding:6px 10px;border:1px solid #c3cfe2;border-radius:6px;background:#fff;color:#1d327b;font:600 12px 'Inter',Arial,sans-serif;cursor:pointer;text-decoration:none}
button.sm.dg{color:#b42318;border-color:#f1b9b3}
.lst .tb td{font-size:12px}
.cst{margin:8px 0 0;font:400 12px/1.4 'Inter',Arial,sans-serif;color:#5c6478}.cst.ok{color:#166534}
.tb.qt td{vertical-align:middle}.tb.qt th.c,.tb.qt td.c{text-align:center}.tb.qt td.nd{color:#a0aec0}
input.q{width:70px;padding:7px;text-align:center;border:1px solid #c3cfe2;border-radius:6px;font:700 14px 'Inter',Arial,sans-serif}
.qres{margin:10px 0;font:700 13px 'Inter',Arial,sans-serif;color:#166534}.qres.bad{color:#b42318}
details.obs{margin-top:12px}details.obs summary{cursor:pointer;font:600 12px 'Inter',Arial,sans-serif;color:#1d327b}details.obs textarea{width:100%;margin-top:8px;padding:10px;border:1px solid #c3cfe2;border-radius:8px;font:400 14px 'Inter',Arial,sans-serif}

body.noc img{-webkit-user-drag:none;pointer-events:none}
.avoc{display:none}
body.noc.oculto #app>main,body.noc.oculto #app>.hd,body.noc.oculto #app>.alert,body.noc.oculto #app>.ft{visibility:hidden}
body.noc.oculto .avoc{display:block;position:fixed;left:0;right:0;top:40%;text-align:center;font:700 15px 'Inter',Arial,sans-serif;color:#1d327b;z-index:60}

var P_TOKEN=(new URLSearchParams(location.search).get('p')||'').trim();
var app=document.getElementById('app');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function brl(v){return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pct(v){return String(Math.abs(v).toFixed(2)).replace(/0+$/,'').replace(/\.$/,'').replace('.',',')+'%'}
function lista(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function dt(v){return v?new Date(v).toLocaleDateString('pt-BR'):''}
function dth(v){return v?new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}
function erro(t,msg,btn){app.replaceChildren();var d=el('div','err');d.append(el('h2','',t),el('p','',msg));
  if(btn){var a=el('button','btn',btn[0]);a.onclick=btn[1];d.append(a)}app.append(d)}
function topo(){var hd=el('div','hd');var im=el('img');im.src=LOGO;im.alt='Boxer';hd.append(im,el('div','k','Proposta comercial · BPartner Diamante'));return hd}
function sair(){return sbc.auth.signOut({scope:'local'}).then(function(){location.reload()})}
function xesc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function marcaDagua(linhas){
  function cut(x,n){x=String(x||'');return x.length>n?x.slice(0,n-1)+'…':x}
  var t1=xesc(cut(linhas[0],44)),t2=xesc(cut(linhas[1],60));
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380"><g transform="rotate(-26 380 190)" fill="#1d327b" fill-opacity="0.10" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><text x="380" y="180" font-size="20">'+t1+'</text><text x="380" y="208" font-size="13">'+t2+'</text></g></svg>';
  var d=el('div','wm');d.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';return d}

/* ---------- porta de entrada por codigo de e-mail ---------- */
function chamarAcesso(p){return fetch(HUB_API+'/api/disponibilidade?target=acesso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
  .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||('erro '+r.status));return j})})}
function telaEmail(msg,ok){
  app.replaceChildren();var w=el('div','lg');var c=el('div','lgc');
  c.append(el('h2','',P_TOKEN?'Acesso à proposta':'Acesso restrito'),
    el('p','',P_TOKEN?'Para a sua segurança, confirme o seu e-mail. Enviaremos um código de 6 dígitos. O acesso fica registrado com o seu e-mail.':'Entre com o seu e-mail cadastrado. Enviaremos um código de 6 dígitos para confirmar.'));
  if(msg){c.append(el('div','msg'+(ok?' ok':''),msg))}
  var l=el('label','','E-mail');var i=el('input');i.type='email';i.autocomplete='email';i.placeholder='seu@email.com';i.value=EMAIL_LOGIN||'';
  var b=el('button','','Enviar código');
  b.onclick=function(){pedirCodigo(i.value,b)};i.onkeydown=function(e){if(e.key==='Enter')b.click()};
  c.append(l,i,b);w.append(c);app.append(topo(),w);i.focus()}
function telaCodigo(msg,ok){
  app.replaceChildren();var w=el('div','lg');var c=el('div','lgc');
  c.append(el('h2','','Digite o código'),el('p','','Enviamos um código de 6 dígitos para '+EMAIL_LOGIN+'. Confira também a caixa de spam. Ele vale por 10 minutos.'));
  if(msg){c.append(el('div','msg'+(ok?' ok':''),msg))}
  var l=el('label','','Código');var i=el('input');i.inputMode='numeric';i.autocomplete='one-time-code';i.maxLength=8;i.placeholder='000000';
  var b=el('button','','Entrar');b.onclick=function(){confirmarCodigo(i.value,b)};i.onkeydown=function(e){if(e.key==='Enter')b.click()};
  var o=el('button','lk','Usar outro e-mail');o.onclick=function(){telaEmail()};
  c.append(l,i,b,o);w.append(c);app.append(topo(),w);i.focus()}
var MSG_LINK={nao_autorizado:'Este e-mail não é o destinatário desta proposta. Use o e-mail que recebeu o link.',
  expirado:'Esta proposta expirou. Peça uma nova ao seu vendedor Boxer.',cancelado:'Esta proposta foi cancelada. Fale com o seu vendedor Boxer.',
  nao_encontrado:'Link inválido ou não encontrado. Confira o endereço com o seu vendedor Boxer.',
  limite:'Muitas tentativas. Aguarde alguns minutos e tente de novo.',erro:'Não foi possível enviar o código agora. Tente novamente em instantes.',
  pendente:'Seu acesso está em análise. Fale com o seu representante Boxer.',revogado:'O acesso deste e-mail foi encerrado. Fale com o seu representante Boxer.',
  nao_cadastrado:'Este e-mail não está liberado para esta proposta. Fale com o seu representante Boxer.'};
function pedirCodigo(v,btn){
  var email=String(v||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){EMAIL_LOGIN=email;telaEmail('Informe um e-mail válido.');return}
  EMAIL_LOGIN=email;btn.disabled=true;btn.textContent='Enviando...';
  var req=P_TOKEN?{acao:'link_codigo',origem:'diamante',token:P_TOKEN,email:email}:{acao:'codigo',email:email};
  chamarAcesso(req).then(function(r){
    var st=r.status||'enviado';
    if(st==='enviado'){telaCodigo('Código enviado!',true);return}
    var m=MSG_LINK[st]||MSG_LINK.erro;
    if(st==='nao_autorizado'&&r.dica)m+=' (cadastrado: '+r.dica+')';
    telaEmail(m)
  }).catch(function(){telaEmail(MSG_LINK.erro)})}
function confirmarCodigo(v,btn){
  var token=String(v||'').replace(/\D/g,'');
  if(token.length<6){telaCodigo('Digite o código recebido por e-mail.');return}
  btn.disabled=true;btn.textContent='Entrando...';
  if(P_TOKEN){
    sbc.rpc('link_validar_codigo',{p_origem:'diamante',p_token:P_TOKEN,p_email:EMAIL_LOGIN,p_codigo:token,p_ua:navigator.userAgent}).then(function(r){
      var d=r.data;if(r.error||!d||!d.ok){telaCodigo(d&&d.motivo==='bloqueado'?'Muitas tentativas. Peça um novo código.':(d&&d.motivo==='expirado'?'Esta proposta expirou.':'Código inválido ou expirado. Peça um novo código.'));return}
      try{sessionStorage.setItem('dia_sess_'+P_TOKEN,JSON.stringify({s:d.sessao,e:d.email,x:d.expira_em}))}catch(e){}
      carregarProposta(d.sessao)}).catch(function(){telaCodigo('Erro de conexão. Tente novamente.')});return}
  sbc.auth.verifyOtp({email:EMAIL_LOGIN,token:token,type:'email'}).then(function(r){
    if(r.error)return sbc.auth.verifyOtp({email:EMAIL_LOGIN,token:token,type:'magiclink'});return r}).then(function(r){
    if(r.error||!r.data||!r.data.session){telaCodigo('Código inválido ou expirado. Peça um novo código.');return}
    carregar()}).catch(function(){telaCodigo('Erro de conexão. Tente novamente.')})}

function cartoes(R){
  var g=el('div','grid');
  R.modelos.forEach(function(m){

function protegerLeitura(){
  document.body.classList.add('noc');
  var stop=function(e){e.preventDefault();return false};
  ['copy','cut','contextmenu','dragstart','selectstart','beforeprint'].forEach(function(ev){document.addEventListener(ev,stop,true)});
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if(k==='printscreen'){try{navigator.clipboard&&navigator.clipboard.writeText('')}catch(x){}ocultar(true);setTimeout(function(){ocultar(false)},1800);e.preventDefault();return}
    if((e.ctrlKey||e.metaKey)&&['p','s','c','a','u','x','i'].indexOf(k)>=0){e.preventDefault();e.stopPropagation();return false}
    if(k==='f12'||(e.ctrlKey&&e.shiftKey&&['i','j','c','s'].indexOf(k)>=0)){e.preventDefault();return false}
    if(e.metaKey&&e.shiftKey&&['3','4','5'].indexOf(k)>=0){ocultar(true);setTimeout(function(){ocultar(false)},1800)}
  },true);
  var tmr=null;
  function ocultar(v){document.body.classList.toggle('oculto',v)}
  window.addEventListener('blur',function(){ocultar(true)});
  window.addEventListener('focus',function(){ocultar(false)});
  document.addEventListener('visibilitychange',function(){ocultar(document.hidden)});
  ocultar(!document.hasFocus())}
