<title>Proposta Laser Boxer · BPartner Diamante</title>
<style>
/* ===== CONFIGURAÇÃO PARA O DESENVOLVEDOR (ver README no topo do script) ===== */
:root{--dark:#00083b;--blue:#1d327b;--vivid:#0005e1;--cy:#25bbee;--red:#e30613;--gray:#f5f5f5;--txt:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Montserrat',Arial,sans-serif;color:var(--txt);background:#fff;-webkit-text-size-adjust:100%}
h1,h2,h3,.m{font-family:'Montserrat','Inter',sans-serif}
.hd{background:var(--dark);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px;position:relative;border-bottom:4px solid var(--blue)}
.hd img{height:34px;display:block;margin-bottom:14px}
.hd .k{font:600 11px 'Montserrat';letter-spacing:.14em;color:var(--cy);text-transform:uppercase}
.hd h1{font:800 26px/1.15 'Montserrat';margin-top:6px;max-width:640px}.hd h1 span{color:var(--cy)}
.who{font:400 12px/1.4 'Inter';color:#b9c6ee;margin-top:10px}
.alert{background:var(--red);color:#fff;text-align:center;padding:11px 16px;font:800 12px/1.3 'Montserrat';letter-spacing:.03em;text-transform:uppercase}
.alert span{font-weight:600}
main{max-width:980px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.lead{font:400 15px/1.5 'Inter';margin-bottom:18px}.lead b{color:var(--blue)}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.hd h1{font-size:34px}}
.card{border:1px solid #dde1eb;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,8,59,.10);background:#fff}
.top{background:var(--blue);color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center}
.top b{font:800 19px 'Montserrat'}.top span{font:600 12px 'Montserrat';color:var(--cy)}
.in{padding:16px}
.lab{font:600 10px 'Montserrat';letter-spacing:.1em;text-transform:uppercase;color:#5c6478}
.price{font:800 30px/1.1 'Montserrat';color:var(--vivid);margin:4px 0 6px}
.old{font:400 13px 'Inter';color:#5c6478}.old s{color:#8a93a8}
.save{display:inline-block;margin-top:8px;background:#e8ecf8;color:var(--blue);border-radius:20px;padding:3px 11px;font:700 12px 'Montserrat'}
.demo{margin-top:14px;background:var(--gray);border-left:4px solid var(--cy);border-radius:6px;padding:11px 13px}
.demo .dl{font:600 10px 'Montserrat';letter-spacing:.1em;text-transform:uppercase;color:#5c6478}
.opt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.opt b{font:800 17px 'Montserrat';color:var(--blue)}.opt span{font:400 12px 'Inter'}
.prem{margin-top:18px;background:var(--vivid);color:#fff;border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prem .v{font:800 34px/1 'Montserrat'}.prem .k{font:700 10px 'Montserrat';letter-spacing:.12em;text-transform:uppercase;color:var(--cy);margin-bottom:4px}
.prem .t{font:400 14px/1.45 'Inter';flex:1;min-width:220px}
h2{font:800 20px 'Montserrat';color:var(--blue);margin:28px 0 12px}h2 span{color:var(--cy)}
.steps{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--gray);border-radius:12px;padding:16px}
.n{width:34px;height:34px;border-radius:50%;background:var(--vivid);color:#fff;font:800 16px/34px 'Montserrat';text-align:center;margin-bottom:10px}
.step h3{font:700 15px/1.25 'Montserrat';color:var(--blue);margin-bottom:6px}.step p{font:400 13px/1.5 'Inter'}
.fn{margin-top:26px;font:400 12px/1.5 'Inter';color:#5c6478;border-top:1px solid #e6e9f2;padding-top:12px}
.err{max-width:560px;margin:60px auto;padding:0 20px;text-align:center}.err h2{margin-top:0}
.btn{display:inline-block;margin-top:14px;background:var(--vivid);color:#fff;border-radius:7px;padding:12px 22px;font:700 13px 'Montserrat';letter-spacing:.03em;text-transform:uppercase;text-decoration:none}
.ft{background:var(--dark);color:#cdd7f7;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));font:400 11px/1.6 'Inter'}.ft img{height:22px;display:block;margin-bottom:8px}
@media print{.ft{display:none}}

.lg{max-width:420px;margin:28px auto;padding:0 16px}
.lgc{border:1px solid #dde1eb;border-radius:12px;box-shadow:0 2px 12px rgba(0,8,59,.10);padding:22px}
.lgc h2{margin:0 0 6px;font:800 18px 'Montserrat'}
.lgc p{font:400 13px/1.5 'Inter';color:#5c6478;margin-bottom:14px}
.lgc label{display:block;font:600 10px 'Montserrat';letter-spacing:.1em;text-transform:uppercase;color:#5c6478;margin-bottom:5px}
.lgc input{width:100%;padding:12px;border:1px solid #c3cfe2;border-radius:8px;font:400 16px 'Inter';margin-bottom:12px}
.lgc button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--vivid);color:#fff;font:700 13px 'Montserrat';letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.lgc button[disabled]{opacity:.6;cursor:default}
.lgc .lk{background:none;color:var(--blue);margin-top:8px;text-transform:none;font:600 12px 'Inter';text-decoration:underline}
.msg{border-radius:8px;padding:10px 12px;font:400 13px/1.4 'Inter';margin-bottom:12px;background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}
.sel{margin:0 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sel label{font:600 11px 'Montserrat';letter-spacing:.08em;text-transform:uppercase;color:#5c6478}
.sel select{padding:8px 10px;border:1px solid #c3cfe2;border-radius:8px;font:600 14px 'Inter'}
.out{margin-top:14px;text-align:center}.out button{background:none;border:0;color:#5c6478;font:400 12px 'Inter';text-decoration:underline;cursor:pointer}
@media print{.sel,.out{display:none}}

function brl(v){return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pct(v){return String(Math.abs(v).toFixed(2)).replace(/0+$/,'').replace(/\.$/,'').replace('.',',')+'%'}
function lista(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function erro(t,msg,btn){app.replaceChildren();var d=el('div','err');d.append(el('h2','',t),el('p','',msg));
  if(btn){var a=el('button','btn',btn[0]);a.onclick=btn[1];d.append(a)}app.append(d)}
function topo(){var hd=el('div','hd');var im=el('img');im.src=LOGO;im.alt='Boxer';hd.append(im,el('div','k','Proposta comercial · BPartner Diamante'));return hd}
function sair(){return sbc.auth.signOut({scope:'local'}).then(function(){location.reload()})}

/* ---------- login por codigo de e-mail (mesmo fluxo da tabela de precos) ---------- */
function chamarAcesso(p){return fetch(HUB_API+'/api/disponibilidade?target=acesso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
  .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||('erro '+r.status));return j})})}
function telaLogin(msg,ok){
  app.replaceChildren();var w=el('div','lg');var c=el('div','lgc');
  c.append(el('h2','','Acesso restrito'),el('p','','Entre com o seu e-mail cadastrado. Enviaremos um código de 6 dígitos para confirmar.'));
  if(msg){c.append(el('div','msg'+(ok?' ok':''),msg))}
  var l=el('label','','E-mail');var i=el('input');i.type='email';i.autocomplete='email';i.placeholder='seu@email.com';i.value=EMAIL_LOGIN||'';
  var b=el('button','','Enviar código');
  b.onclick=function(){pedirCodigo(i.value,b)};i.onkeydown=function(e){if(e.key==='Enter')b.click()};
  c.append(l,i,b);w.append(c);app.append(topo(),w);i.focus()}
function telaCodigo(msg,ok){
  app.replaceChildren();var w=el('div','lg');var c=el('div','lgc');
  c.append(el('h2','','Digite o código'),el('p','','Enviamos um código de 6 dígitos para '+EMAIL_LOGIN+'. Confira também a caixa de spam.'));
  if(msg){c.append(el('div','msg'+(ok?' ok':''),msg))}
  var l=el('label','','Código');var i=el('input');i.inputMode='numeric';i.autocomplete='one-time-code';i.maxLength=8;i.placeholder='000000';
  var b=el('button','','Entrar');b.onclick=function(){confirmarCodigo(i.value,b)};i.onkeydown=function(e){if(e.key==='Enter')b.click()};
  var o=el('button','lk','Usar outro e-mail');o.onclick=function(){telaLogin()};
  c.append(l,i,b,o);w.append(c);app.append(topo(),w);i.focus()}
function pedirCodigo(v,btn){
  var email=String(v||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){EMAIL_LOGIN=email;telaLogin('Informe um e-mail válido.');return}
  EMAIL_LOGIN=email;btn.disabled=true;btn.textContent='Enviando...';
  chamarAcesso({acao:'codigo',email:email}).then(function(r){
    var st=r.status||'enviado';
    if(st==='enviado'){telaCodigo('Código enviado!',true);return}
    var m={nao_cadastrado:'Este e-mail não está liberado para esta proposta. Fale com o seu representante Boxer.',
      pendente:'Seu acesso está em análise. Fale com o seu representante Boxer.',
      expirado:'O prazo do seu acesso terminou. Fale com o seu representante Boxer.',
      revogado:'O acesso deste e-mail foi encerrado. Fale com o seu representante Boxer.',
      limite:'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
      erro:'Não foi possível enviar o código agora. Tente novamente em instantes.'};
    telaLogin(m[st]||m.erro)
  }).catch(function(){telaLogin('Não foi possível enviar o código agora. Tente novamente em instantes.')})}
function confirmarCodigo(v,btn){
  var token=String(v||'').replace(/\D/g,'');
  if(token.length<6){telaCodigo('Digite o código recebido por e-mail.');return}
  btn.disabled=true;btn.textContent='Entrando...';
  sbc.auth.verifyOtp({email:EMAIL_LOGIN,token:token,type:'email'}).then(function(r){
    if(r.error)return sbc.auth.verifyOtp({email:EMAIL_LOGIN,token:token,type:'magiclink'});return r}).then(function(r){
    if(r.error||!r.data||!r.data.session){telaCodigo('Código inválido ou expirado. Peça um novo código.');return}
    carregar()}).catch(function(){telaCodigo('Erro de conexão. Tente novamente.')})}

/* ---------- proposta ---------- */
function render(d){
  var R=d.regiao,U=d.usuario||{},M=R.modelos,dm=M.filter(function(m){return m.demonstracao.length}).map(function(m){return m.modelo});
  app.replaceChildren();
  var hd=topo();
  var h1=el('h1');h1.append('Laser Boxer: ');var sp=el('span','','preço de oferta');h1.append(sp,' para a sua revenda');hd.append(h1);
  var emit=d.emitido_em?new Date(d.emitido_em).toLocaleDateString('pt-BR'):'';
  hd.append(el('div','who','Acesso registrado'+(U.email?' · '+U.email:'')+(emit?' · '+emit:'')));
  var al=el('div','alert');al.append((d.validade||'Preços válidos para compras em 2026')+' · ',el('span','','Reajuste de preços a partir de '+(d.reajuste_a_partir_de||'04/01/2027')));
  var main=el('main');
  if(d.regioes&&d.regioes.length>1){var s=el('div','sel');s.append(el('label','','Região'));var sl=el('select');
    d.regioes.forEach(function(g){var o=el('option','',g.rotulo);o.value=g.regiao;if(g.regiao===R.regiao)o.selected=true;sl.append(o)});
    sl.onchange=function(){carregar(sl.value)};s.append(sl);main.append(s)}
  var lead=el('p','lead');lead.append('Compre para estoque pelo ');lead.append(el('b','','preço de oferta'));
  if(dm.length){lead.append('. Nos modelos '+lista(dm)+' você também pode comprar uma ');lead.append(el('b','','máquina de demonstração com desconto adicional'))}
  lead.append('.');main.append(lead);
  var g=el('div','grid');
  M.forEach(function(m){
    var c=el('div','card'),t=el('div','top');t.append(el('b','',m.modelo),el('span','','Laser '+m.potencia));
    var i=el('div','in');i.append(el('div','lab','Preço de oferta'),el('div','price',brl(m.oferta)));
    var o=el('div','old','tabela normal ');o.append(el('s','',brl(m.tabela_normal)));i.append(o);
    i.append(el('span','save','−'+pct(m.desconto_pct)+' · economia de '+brl(m.economia)));
    if(m.demonstracao.length){var b=el('div','demo');b.append(el('div','dl','Máquina de demonstração'));
      m.demonstracao.forEach(function(p){var r=el('div','opt');r.append(el('b','',brl(p.valor)),el('span','','−'+pct(p.desconto_pct)+' · '+p.parcelas+'x de '+brl(p.parcela)));b.append(r)});i.append(b)}
    c.append(t,i);g.append(c)});
  main.append(g);
  var pr=el('div','prem');pr.append(el('div','v','R$ '+R.premiacao.valor));var pt=el('div','t');pt.append(el('div','k','Premiação para o vendedor'),
    document.createTextNode(R.premiacao.texto+' Válido '+(R.premiacao.modelos.length===M.length?'em todos os modelos':'nos modelos '+lista(R.premiacao.modelos))+'.'));pr.append(pt);main.append(pr);
  main.append(el('h2','','Como entrar no projeto'));
  var st=el('div','steps');
  [['1','Compre 1 máquina para estoque','É o mínimo de compra para entrar no projeto, pelo preço de oferta.'],
   ['2','Compre também 1 máquina para demonstração','Com desconto adicional sobre o preço de oferta e parcelamento. '+R.recompra_demonstracao],
   ['3','Demonstre e venda','O cliente vê o laser funcionando antes de decidir. O vendedor que fechar a venda ganha R$ '+R.premiacao.valor+' de premiação.']
  ].forEach(function(s){var d=el('div','step');d.append(el('div','n',s[0]),el('h3','',s[1]),el('p','',s[2]));st.append(d)});
  main.append(st,el('div','fn',R.nota_rodape));
  var ou=el('div','out');var ob=el('button','','Sair deste aparelho');ob.onclick=sair;ou.append(ob);main.append(ou);
  var ft=el('div','ft');var l2=el('img');l2.src=LOGO;l2.alt='Boxer';ft.append(l2,'www.boxersoldas.com.br · contato@boxersoldas.com.br · (19) 99646-0708');
  app.append(hd,al,main,ft);
}
function carregar(regiao){
  sbc.rpc('proposta_diamante',{p_regiao:regiao||null}).then(function(r){
    if(r.error)throw r.error;var d=r.data;
    if(!d||!d.permitido){
      var mo=d&&d.motivo;
      if(mo==='sem_login'||mo==='sem_codigo'||mo==='sessao_expirada'){sbc.auth.signOut({scope:'local'}).then(function(){telaLogin(mo==='sessao_expirada'?'Sua sessão expirou. Entre de novo com um novo código.':'')});return}
      if(mo==='nao_liberado'||mo==='sem_regiao'){erro('Sem acesso a esta proposta','Seu usuário não tem permissão para esta proposta. Fale com o seu representante Boxer.',['Entrar com outro e-mail',sair]);return}
      erro('Proposta indisponível','Não foi possível montar a proposta agora. Avise a equipe Boxer.');return}
    render(d)
  }).catch(function(){erro('Não foi possível carregar','Tente novamente em instantes. Se continuar, avise a equipe Boxer.')})}
(function(){sbc.auth.getSession().then(function(r){if(r.data&&r.data.session)carregar();else telaLogin()}).catch(function(){telaLogin()})})();
</script></body></html>
